name: PositionBar release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from an approved versions/<version>.json PR merged into private main
        required: true
        type: string
      source_sha:
        description: Exact private-main version PR merge commit
        required: true
        type: string
      resume_run_id:
        description: Completed run containing exact DMG checkpoint; empty for a fresh Build ID
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: positionbar-direct-release
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      APP_STORE_API_KEY_ID: ${{ vars.APP_STORE_API_KEY_ID }}
      APP_STORE_API_ISSUER_ID: ${{ vars.APP_STORE_API_ISSUER_ID }}
    steps:
      - name: Configure the temporary release state
        run: echo "RELEASE_STATE=$RUNNER_TEMP/release-state" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release
          persist-credentials: false
      - name: Locate the original checkpoint
        if: inputs.resume_run_id != ''
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: python3 -B release/scripts/ci.py recovery --run-id "$RESUME_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: inputs.resume_run_id != ''
        with:
          name: ${{ steps.recovery.outputs.artifact }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.RELEASE_STATE }}
      - name: Verify exact source, version file, owner approval and publication state
        id: request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          args=()
          if [[ -n "$RESUME_RUN_ID" ]]; then args+=(--resume); fi
          python3 -B release/scripts/ci.py prepare --state "$RELEASE_STATE" "${args[@]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.request.outputs.complete == 'false'
        with:
          repository: sorcererxw/positionbar
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.GH_PAT }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.request.outputs.complete == 'false'
        with:
          repository: PositionBar/homebrew-tap
          ref: main
          token: ${{ secrets.TAP_WRITE_TOKEN }}
          path: tap
          persist-credentials: false
      - name: Check credentials and resolve the pinned native dependencies
        if: steps.request.outputs.complete == 'false'
        env:
          GH_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_API_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          names = ('GH_TOKEN', 'DEVELOPER_ID_CERTIFICATE_P12_BASE64', 'DEVELOPER_ID_CERTIFICATE_PASSWORD',
                   'APP_STORE_API_PRIVATE_KEY', 'SPARKLE_PRIVATE_KEY', 'APP_STORE_API_KEY_ID',
                   'APP_STORE_API_ISSUER_ID')
          missing = [name for name in names if not os.environ.get(name)]
          if missing: raise SystemExit('Missing release credentials: ' + ', '.join(missing))
          PY
          [[ "$(gh api repos/PositionBar/homebrew-tap --jq .permissions.push)" == true ]]
          unset GH_TOKEN DEVELOPER_ID_CERTIFICATE_P12_BASE64 DEVELOPER_ID_CERTIFICATE_PASSWORD
          unset APP_STORE_API_PRIVATE_KEY SPARKLE_PRIVATE_KEY
          python3 -B source/scripts/macos_release.py toolchain
          echo "POSITIONBAR_SOURCE_PACKAGES=$RUNNER_TEMP/SourcePackages" >> "$GITHUB_ENV"
          xcodebuild -resolvePackageDependencies -project source/apps/macos/PositionBar.xcodeproj \
            -scheme PositionBar -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile > "$RUNNER_TEMP/package-resolution.log" 2>&1
          tool="$(find "$RUNNER_TEMP/SourcePackages/artifacts" -type f -name generate_appcast -print -quit)"
          [[ -n "$tool" && -x "$tool" && -x "$(dirname "$tool")/sign_update" ]]
          echo "SPARKLE_BIN=$(dirname "$tool")" >> "$GITHUB_ENV"
          git -C tap config user.name github-actions[bot]
          git -C tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Reserve one Build ID or restore its verified DMG identity
        if: steps.request.outputs.complete == 'false'
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          args=()
          if [[ -n "$RESUME_RUN_ID" ]]; then args+=(--resume); fi
          python3 -B source/scripts/macos_release.py prepare --state "$RELEASE_STATE" \
            --source "$SOURCE_SHA" --version "$VERSION" "${args[@]}"
      - name: Build, sign and notarize Universal DMG and all ten Sparkle notes
        if: steps.request.outputs.complete == 'false'
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_API_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if ! python3 -B -c 'import sys; sys.path.insert(0, "source/scripts"); import macos_release; macos_release.main()' package --state "$RELEASE_STATE" \
            --source "$SOURCE_SHA" --version "$VERSION" > "$RUNNER_TEMP/package.log" 2>&1; then
            openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/package.log" \
              -out "$RELEASE_STATE/package-diagnostics.cms" -outform DER release/diagnostics-public.pem
            echo 'Packaging failed; preserve the checkpoint and use a new Build ID if no verified DMG exists.'
            exit 1
          fi
      - name: Publish the DMG, verified Homebrew cask and standalone signed updates
        if: steps.request.outputs.complete == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
        run: python3 -B release/scripts/publish.py --state "$RELEASE_STATE" --source "$GITHUB_WORKSPACE/source" --tap "$GITHUB_WORKSPACE/tap"
      - name: Preserve exact bytes and non-secret recovery identity
        if: always() && steps.request.outputs.complete == 'false'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-checkpoint
          path: |
            ${{ env.RELEASE_STATE }}/request.json
            ${{ env.RELEASE_STATE }}/version.json
            ${{ env.RELEASE_STATE }}/identity/build-identity.plist
            ${{ env.RELEASE_STATE }}/package/package.json
            ${{ env.RELEASE_STATE }}/package/release.json
            ${{ env.RELEASE_STATE }}/package/PositionBar-*.dmg
            ${{ env.RELEASE_STATE }}/package/PositionBar-*.txt
            ${{ env.RELEASE_STATE }}/package/appcast.xml
            ${{ env.RELEASE_STATE }}/package-diagnostics.cms
          retention-days: 30
          if-no-files-found: warn
